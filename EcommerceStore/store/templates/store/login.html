
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>
<body>
    <header>
        <h1>Login</h1>
    </header>

    <main class="product-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="{% url 'register' %}">Register here</a>
        </p>

        <a href="/">Back to Store</a>
    </main>
</body>
</html>
