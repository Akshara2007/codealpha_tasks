
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConnectHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
        }
        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
        }
        button {
            background: #172554;
            color: white;
            border: 0;
            cursor: pointer;
        }
        a { color: #172554; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome back!</h2>

        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>

        <p>New to ConnectHub? <a href="{% url 'register' %}">Create an account</a></p>
        <a href="{% url 'home' %}">Back to home</a>
    </div>
</body>
</html>
